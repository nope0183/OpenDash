; NineDash-аналог для CYD (ESP32-2432S028, ревизия с 2 USB, дисплей ST7789)
; Платформа закреплена на Arduino-core 2.x: код авторизации использует mbedtls *_ret функции,
; которых нет в core 3.x.

[common]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
parts = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    h2zero/NimBLE-Arduino@~1.4.2
    adafruit/Adafruit NeoPixel@^1.12.3
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
common_flags =
    -DUSER_SETUP_LOADED=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1

[env:cyd_2usb]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = +<main.cpp>
board_build.partitions = ${common.parts}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.common_flags}
    -DST7789_DRIVER=1
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR

[env:cyd_ili9341]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_src_filter = +<main.cpp>
board_build.partitions = ${common.parts}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.common_flags}
    -DILI9341_2_DRIVER=1
